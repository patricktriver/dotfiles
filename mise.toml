# Patrick's dotfiles. Apply with `mise bootstrap` from this directory.
# Machine-only extras can go in mise.local.toml (gitignored).

[bootstrap.packages]
"brew:herdr" = "latest"
"brew:fresh-editor" = "latest"
"brew:lazygit" = "latest"
"brew:gh" = "latest"
"brew:usage" = "latest"
"brew:docker" = "latest"
"brew:codex" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:arc" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:bruno" = "latest"
"brew-cask:spotify" = "latest"
# Data tools
"brew:awscli" = "latest"
"brew:snowflake-cli" = "latest"
"brew:snowflake" = "latest"
"brew:unixodbc" = "latest"
"brew:poppler" = "latest"
"brew:pytest" = "latest"
"brew:r" = "latest"
"brew-cask:dbeaver-community" = "latest"
"brew-cask:tableau" = "latest"
"brew-cask:tableplus" = "latest"
"brew-cask:session-manager-plugin" = "latest"
"brew-cask:snowflake-snowsql" = "latest"
"brew-cask:rstudio" = "latest"

[dotfiles]
"~/.config/mise/config.toml" = { source = "mise/config.toml", mode = "symlink" }
"~/.zshrc" = { source = "zsh/zshrc", mode = "symlink" }
"~/.zprofile" = { source = "zsh/zprofile", mode = "symlink" }
"~/.zshenv" = { source = "zsh/zshenv", mode = "symlink" }
"~/.gitconfig" = { source = "git/gitconfig", mode = "symlink" }
"~/.config/git/ignore" = { source = "git/ignore", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "herdr/config.toml", mode = "symlink" }
"~/.config/fresh/config.json" = { source = "fresh/config.json", mode = "symlink" }
"~/Library/Application Support/com.mitchellh.ghostty/config.ghostty" = { source = "ghostty/config.ghostty", mode = "symlink" }
# Claude Code: only generic ways-of-working skills/commands. Work-specific
# ones stay unversioned in ~/.claude.
"~/.claude/commands/*.md" = { source = "claude/commands/*.md", mode = "symlink" }
"~/.claude/skills/council" = { source = "claude/skills/council", mode = "symlink" }
"~/.claude/skills/stop-slop" = { source = "claude/skills/stop-slop", mode = "symlink" }
"~/.claude/skills/wrap-up" = { source = "claude/skills/wrap-up", mode = "symlink" }
"~/.claude/skills/pr-off-main" = { source = "claude/skills/pr-off-main", mode = "symlink" }
"~/.local/bin/keys" = { source = "bin/keys", mode = "symlink" }
"~/.local/bin/herdr-here" = { source = "bin/herdr-here", mode = "symlink" }
"~/.local/bin/review" = { source = "bin/review", mode = "symlink" }

# Imperative setup the declarative sections can't express. Runs on every
# bootstrap, so each step is guarded.
[tasks.bootstrap]
run = '''
[ -d ~/.oh-my-zsh ] || sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc
herdr integration status | grep -q '^claude: current' || herdr integration install claude
herdr integration status | grep -q '^codex: current' || herdr integration install codex
git -C "{{config_root}}" config core.hooksPath .githooks
# Global tools are only linked in by the dotfiles phase, after mise loaded
# config, so install them here too. A no-op when nothing is missing.
mise install
'''
